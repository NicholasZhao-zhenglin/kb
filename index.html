er)<\/code>，只有三个业务路由。导入过程会触及分词资源、tokenizer 与全局 ES 客户端。根启动脚本用 shell 从 .env 导出变量，Compose 用 env_file，两者不是统一的 Settings 校验入口。没有 readiness 路由或启动资源自检报告。<\/p>\n<h3 id=\"rag-core-call-chains--链路二上传解析向量化索引\">链路二：上传、解析、向量化、索引<\/h3>\n<p>入口：<code>frontend/src/pages/repository/components/upload.tsx::submit<\/code>。它按队列串行上传、跳过 status=done 的项、客户端限制每个文件 5 MiB；<code>api.session.upload<\/code> 创建 FormData，只追加 files，没有 session_id。<\/p>\n<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant UI as RepositoryUpload\n  participant API as upload_files\n  participant FS as 临时或本地文件\n  participant P as execute_insert_process\n  participant ES as ESConnection\n  UI-&gt;&gt;API: multipart files, 无 session_id\n  API-&gt;&gt;FS: default 目录写原文件\n  API-&gt;&gt;P: parse(file_path)\n  P-&gt;&gt;P: chunk, process_item, 每块远程 embedding\n  P-&gt;&gt;ES: insert(result, indexName=default)\n  ES--&gt;&gt;P: 错误列表或空列表\n  P--&gt;&gt;API: None，未检查错误列表\n  API--&gt;&gt;UI: status=success\n<\/code><\/pre>\n<p>箭头是程序调用顺序，不意味着磁盘与 ES 原子提交。后端先创建目录，在 try 内以 wb 写原文件，<code>await file.read()<\/code> 一次取全文件，再同步执行解析。没有服务端大小配额、文件名规范化或所属用户判断。P03 在临时目录中复现 session_id 与文件名越过预期子目录；没有触碰真实目录（F04）。<\/p>\n<p><code>file_parse.parse<\/code> → <code>naive.chunk<\/code>：默认 128 token 配置，PDF 走 OCR/布局/表格分析，DOCX 解析段落表格，TXT 与 Markdown 有路径读取；XLSX/JSON 分支把 binary=None 传给要求数据的下游，实际上传链只传路径，P06 验证有效合成文件仍失败（F07）。<code>naive_merge<\/code> 检查的是已有 chunk 长度，不能将 128 解释成所有输出的硬上限。<\/p>\n<p><code>process_item<\/code> 串行调用嵌入，构造 q_1024_vec、doc_id、kb_id、分词与时间字段。失败时它返回 None，列表未过滤，后续可能在 ES insert 断言处失败。不同文件相同内容产生相同 _id（F08）。<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>已写入状态<\/th>\n<th>失败后用户可见状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>文件已保存<\/td>\n<td>原文件可能覆盖同名旧文件<\/td>\n<td>后续失败不删除或回滚原文件<\/td>\n<\/tr>\n<tr>\n<td>多块嵌入中<\/td>\n<td>前面已产生远程调用<\/td>\n<td>没有断点续跑或取消后清理<\/td>\n<\/tr>\n<tr>\n<td>bulk 返回 item 错误<\/td>\n<td>可能部分块成功<\/td>\n<td>错误列表被忽略，仍报 success（P04）<\/td>\n<\/tr>\n<tr>\n<td>bulk 非超时异常<\/td>\n<td>实际写入未知<\/td>\n<td>insert 清空 res，重复后可能返回空错误列表（P07）<\/td>\n<\/tr>\n<tr>\n<td>bulk 成功但未 refresh<\/td>\n<td>索引写入与搜索可见分离<\/td>\n<td>无 ready 状态；未实测搜索延迟<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>上传没有后台任务 ID、进度存储、事务或回滚。ES insert 内两次循环是局部重试，不构成整个上传用例的恢复保证。<\/p>\n<h3 id=\"rag-core-call-chains--链路三创建聊天与检索\">链路三：创建聊天与检索<\/h3>\n<p><code>frontend/src/pages/index/index.tsx::send<\/code> → <code>api.session.create<\/code> → POST create_session → UUID 截断成 16 位十六进制字符串 → 前端 sessionActions.add（内存）→ PageTransport 保存第一条 message → <code>/chat/:id<\/code> 页面 useMount 调用 send。<\/p>\n<p><code>send<\/code> 创建 user 与 assistant 两条消息 → <code>sendChat<\/code> → <code>api.session.chat<\/code> 用 fetch adapter 请求流，并把路由 id 放入 query 的 session_id。后端 <code>chat_on_docs<\/code> 验证 ChatRequest 后，直接同步 <code>retrieve_content(session_id, question)<\/code>。这里没有读取历史消息，传给模型的只有当前拼好的 prompt。<\/p>\n<p>检索链：<code>retrieval.py::retrieve_content<\/code> → 全局 <code>Dealer.retrieval<\/code> → <code>search<\/code> → <code>FulltextQueryer.question<\/code> 构造文本条件 → <code>model.generate_embedding<\/code> 生成查询向量 → <code>ESConnection.search<\/code> 构造全文、knn、融合表达式。默认召回候选 size=max(5×3,128)=128，topk=1024；不是“仅在 ES 查五条”。空结果时再降低 min_match 并调整向量阈值，随后默认第一阶段候选走远程 rerank，再取 page_size=5。<\/p>\n<p>上传索引 default 与这个随机 session 索引不一致（F02/P02）。即使创建了 session，也没有复制文档、别名或知识库关联；不能假定新 session 自动拥有已上传文档。索引不存在时是否报特定 ES 异常依赖真实客户端，本轮仅确认读写命名空间不同。<\/p>\n<p>默认 kb_ids=None，ES 条件构造跳过空值，主要边界依赖调用者给出的 indexNames。调用者可以直接给字符串，代码还允许逗号拆分；没有服务器授权映射。需要把“筛选索引”与“有权读取索引”分开理解（F04）。<\/p>\n<p><code>model.rerank_similarity<\/code> 从返回节点中只保留 score；<code>Dealer.rerank_by_model<\/code> 则沿原始候选顺序混合 token 分数。若供应商适配器返回已排序节点，会错配分数和原 chunk。P08 用换序 fake 证明条件风险，实际自定义 rerank 包版本与返回顺序未安装验证，列入待确认 Q01，不冒充线上错排。<\/p>\n<h3 id=\"rag-core-call-chains--链路四模型输出与-sse-消费\">链路四：模型输出与 SSE 消费<\/h3>\n<p><code>chat_on_docs<\/code> 把编号引用拼入 prompt → 返回 StreamingResponse → 同步生成器 <code>chat.get_chat_completion<\/code> 调用 deepseek-r1。创建流成功后先发 documents，再逐块发送 content/thinking；finish_reason=stop 时同步调用第二个模型生成推荐问题，之后发 <code>[DONE]<\/code>。因此最后一段回答到 end 之间还可能等待推荐请求。<\/p>\n<p>已有保证：用 JSON 编码正文；生成器捕获异常并发 event:error。缺口：检索在生成器之前，检索异常不走流内 error；生成器 error 没有统一终态事件；只有 stop 分支发送 end，其他结束原因与自然 EOF 没有同等语义；没有显式应用级总时间预算或持久化重放游标。SDK 的默认重试/超时不等于本项目定义的产品预算。<\/p>\n<p>前端 <code>read<\/code> 累积网络字节解码结果、按换行分割，只处理 data 行；<code>parseData<\/code> 忽略 event 与 role，只要 content 非空就追加到答案。P09 验证后端 role:error 被展示成回答而没有设置 target.error（F10）。<code>[DONE]<\/code> 只被跳过，loading 最终靠 EOF/finally 清理。useUnmount 仅重置 device chatting，没有绑定 reader.cancel 或请求中止；重复请求插件的取消能力不等价于页面卸载释放流。<\/p>\n<p>前端 TextDecoder 未用流式 decode 选项，若收到原始 UTF-8 多字节跨包会有风险；当前 Python json.dumps 默认转义非 ASCII，因此不把这项扩大为当前中文回答必然乱码。<\/p>\n<p><code>ChatMessage<\/code>、引用 Drawer → <code>components/markdown/index.tsx<\/code> → Marked → dangerouslySetInnerHTML。P10 证明当前锁定 Marked 保留合成事件属性，组件没有清洗，因此从模型或文档来的 HTML 是信任边界（F09）。未在真实浏览器执行脚本或访问用户存储。<\/p>\n<h3 id=\"rag-core-call-chains--链路五刷新与伪完整状态\">链路五：刷新与伪完整状态<\/h3>\n<p>没有 PageTransport 首条消息时，聊天页调用 <code>/get_messages/<\/code>；导航页读取 <code>/get_sessions/<\/code>。两者在本后端均为 404（P01）。<code>repository/index.tsx<\/code> 的 useRequest 返回两条硬编码示例，refresh 只是重新返回示例；设置、删除等按钮没有真实处理链。<\/p>\n<p><code>assistant.py<\/code>、<code>session.py<\/code>、<code>retrieval2.py<\/code>、<code>service/chat_with_doc.py<\/code> 是遗留/备选函数，未被默认 app/router 链调用；不能借它们的函数名认定主路径具有持久化或完整 RAGFlow 服务能力。<\/p>","outline":[{"lvl":1,"text":"rag · 核心代码调用链","id":"rag-core-call-chains--rag--核心代码调用链"},{"lvl":2,"text":"链路一：启动与页面准入","id":"rag-core-call-chains--链路一启动与页面准入"},{"lvl":2,"text":"链路二：上传、解析、向量化、索引","id":"rag-core-call-chains--链路二上传解析向量化索引"},{"lvl":2,"text":"链路三：创建聊天与检索","id":"rag-core-call-chains--链路三创建聊天与检索"},{"lvl":2,"text":"链路四：模型输出与 SSE 消费","id":"rag-core-call-chains--链路四模型输出与-sse-消费"},{"lvl":2,"text":"链路五：刷新与伪完整状态","id":"rag-core-call-chains--链路五刷新与伪完整状态"}],"words":2059,"read":5},{"id":"rag-engineering-findings","cat":"backend-eng","title":"rag · 工程问题清单","summary":"12 项未修复工程问题与 1 项待确认风险，给出触发条件、源码定位、隔离探针、修复方向和验收。","tags":["rag","工程审查","FastAPI","React","Elasticsearch"],"kicker":"rag 工程审查 · 03/06 · 2026-10-13 · 37ac973 / 3c4cd2a / 56fe651","order":7,"html":"<h2 id=\"rag-engineering-findings--rag--工程问题清单\">rag · 工程问题清单<\/h2>\n<p>审查日期：2026-10-13（Asia/Shanghai）。项目：<code>NicholasZhao-zhenglin/rag<\/code>；总仓库 <code>37ac973e4580442542853bb241e3286caa90dfc3<\/code>，后端 <code>3c4cd2ac1f11c862e31f423054cbef7b3960c7b8<\/code>，前端 <code>56fe6519426174e1b6d8f421bdbeb92e742cc4a4<\/code>。下文完整源码路径相对于 rag 根目录；短路径承接已给出的完整定位：后端入口/路由位于 <code>backend/app/<\/code>，解析、检索、模型及 <code>rag/<\/code>、<code>deepdoc/<\/code> 位于 <code>backend/app/service/ragflow/<\/code>，前端模块位于 <code>frontend/src/<\/code>。审查和隔离验证已执行；业务修复与路线图均未实施。<\/p>\n<p>阅读顺序：<a href=\"index.html#/a/rag-system-architecture\">01 系统架构分析<\/a> → <a href=\"index.html#/a/rag-core-call-chains\">02 核心代码调用链<\/a> → <a href=\"index.html#/a/rag-engineering-findings\">03 工程问题清单<\/a> → <a href=\"index.html#/a/rag-optimization-roadmap\">04 优化路线图<\/a> → <a href=\"index.html#/a/rag-engineering-handbook\">05 工程知识学习手册<\/a> → <a href=\"index.html#/a/rag-interview-questions\">06 面试问答手册<\/a>。<\/p>\n<h3 id=\"rag-engineering-findings--判级与证据规则\">判级与证据规则<\/h3>\n<p>P0 指有证据支持的灾难事故；本轮未确认 P0。P1 是关键功能失败、数据/资源边界风险；P2 是需排期的一致性、交付或维护缺陷；P3 是低风险演进。优先级依据触发场景，不等于证据强度。<\/p>\n<p>“隔离复现”使用真实函数 AST 与合成数据，绕过模块级外部初始化；不代表应用可完整启动。“静态确认”只覆盖看到的实现；“待确认”不混入已确认问题。所有 F 项当前均<strong>未修复<\/strong>。<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>编号<\/th>\n<th>优先级<\/th>\n<th>问题<\/th>\n<th>证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>F01<\/td>\n<td>P1<\/td>\n<td>登录与历史接口缺失，页面准入链不闭合<\/td>\n<td>P01，静态前端调用<\/td>\n<\/tr>\n<tr>\n<td>F02<\/td>\n<td>P1<\/td>\n<td>上传与新聊天使用不同索引<\/td>\n<td>P02<\/td>\n<\/tr>\n<tr>\n<td>F03<\/td>\n<td>P1<\/td>\n<td>凭据硬编码且嵌入配置参数被覆盖<\/td>\n<td>静态确认，未试用凭据<\/td>\n<\/tr>\n<tr>\n<td>F04<\/td>\n<td>P1<\/td>\n<td>无服务端授权与路径约束，可写出会话目录<\/td>\n<td>P03 + 静态读写链<\/td>\n<\/tr>\n<tr>\n<td>F05<\/td>\n<td>P1<\/td>\n<td>bulk 错误被吞并，上传成功不可信<\/td>\n<td>P04、P07<\/td>\n<\/tr>\n<tr>\n<td>F06<\/td>\n<td>P2<\/td>\n<td>async 路由直接执行同步重任务、缺少服务端上传上限<\/td>\n<td>静态路径风险，未压测<\/td>\n<\/tr>\n<tr>\n<td>F07<\/td>\n<td>P2<\/td>\n<td>XLSX/JSON 路径上传未向解析器交付数据<\/td>\n<td>P06<\/td>\n<\/tr>\n<tr>\n<td>F08<\/td>\n<td>P2<\/td>\n<td>chunk 标识不含文档身份，重复段落覆盖归属<\/td>\n<td>P05 + bulk index 操作<\/td>\n<\/tr>\n<tr>\n<td>F09<\/td>\n<td>P1<\/td>\n<td>不可信 Markdown 直接进入 HTML 注入点<\/td>\n<td>P10 + 静态 DOM 接线<\/td>\n<\/tr>\n<tr>\n<td>F10<\/td>\n<td>P2<\/td>\n<td>流内错误被当作答案，取消与终态不完整<\/td>\n<td>P09 + 静态状态机<\/td>\n<\/tr>\n<tr>\n<td>F11<\/td>\n<td>P2<\/td>\n<td>默认依赖安装失败，现有 lint 门禁不通过<\/td>\n<td>npm 命令实测<\/td>\n<\/tr>\n<tr>\n<td>F12<\/td>\n<td>P2<\/td>\n<td>部署入口、资源与依赖缺少可复现闭环<\/td>\n<td>静态配置；未启动部署<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"rag-engineering-findings--f01--登录与历史接口缺失\">F01 · 登录与历史接口缺失<\/h3>\n<p><strong>位置：<\/strong> <code>backend/app/app_main.py::app<\/code>；<code>router/chat_rt.py<\/code> 三个装饰路由；<code>frontend/src/api/user.ts<\/code>、<code>api/session.ts<\/code>、<code>router/guard/auth.tsx<\/code>。<\/p>\n<p><strong>触发与机制：<\/strong> 新浏览器没有 token，业务页面默认需要 auth，跳转登录后请求不存在的后端接口；历史入口同样没有实现。<strong>影响：<\/strong> 该前后端锁定组合无法完成常规登录和会话刷新恢复，不代表所有自定义代理部署都如此。<strong>验证：<\/strong> P01 对实际路由函数注册出的隔离 FastAPI 应用检查四个接口，均 404。<\/p>\n<p><strong>修复方向：<\/strong> 先明确单用户演示或认证产品的契约；实现配套后端或明确关闭不支持的 UI 能力，不能仅在 localStorage 伪造 token。<strong>验收：<\/strong> 干净浏览器进入、登录/准入、创建会话、刷新恢复有一致行为；前端调用清单全部匹配 OpenAPI，未知路径继续 404。<\/p>\n<h3 id=\"rag-engineering-findings--f02--文件写入-default聊天查随机-session\">F02 · 文件写入 default，聊天查随机 session<\/h3>\n<p><strong>位置：<\/strong> <code>frontend/src/api/session.ts::upload/chat<\/code>，<code>pages/index/index.tsx::send<\/code>，<code>backend/app/router/chat_rt.py::upload_files/chat_on_docs<\/code>，<code>file_parse.py::execute_insert_process<\/code>。<\/p>\n<p><strong>触发与机制：<\/strong> RepositoryUpload 不传 session_id，后端用 default；主页随后新建随机 session 并以其作为 ES 索引查询，没有建立关联。<strong>影响：<\/strong> 正常上传→新聊天链无法检索刚上传的那份集合。<strong>证据：<\/strong> P02 记录真实路由对 fake 入库/检索的实参，分别是 default 与新 ID；未模拟 ES 索引存在性。<\/p>\n<p><strong>修复方向：<\/strong> 明确 knowledge_base_id 与 conversation_id 的不同职责，短期也可统一显式 ID，但必须验证授权。<strong>验收：<\/strong> 上传合成标记文本，新建/继续指定知识库会话可返回该标记的引用；另一知识库不会命中。<\/p>\n<h3 id=\"rag-engineering-findings--f03--配置与凭据边界失效\">F03 · 配置与凭据边界失效<\/h3>\n<p><strong>位置：<\/strong> <code>backend/app/service/ragflow/file_parse.py::generate_embedding<\/code>，<code>rag/nlp/model.py::generate_embedding<\/code>，<code>chat.py<\/code> 两个模型入口，<code>rag/utils/es_conn.py::ESConnection.__init__<\/code>。<\/p>\n<p><strong>触发与机制：<\/strong> 源码含可用于凭据位置的硬编码字符串；embedding 函数直接覆盖 api_key/base_url 参数，chat 使用硬编码 fallback，ES 连接也不通过统一配置解析。<code>.env<\/code> 随源码快照提供，但本轮未读取其值。<strong>影响：<\/strong> 仓库可读者可接触嵌入凭据，调用者难以可靠切换账户；有效性与是否发生滥用未验证。正文和探针结果不保存字面凭据。<\/p>\n<p><strong>修复方向：<\/strong> 由维护者轮换相关凭据，移除 fallback 和参数覆盖，启动时校验必需配置；是否清理历史按仓库政策另行决策。<strong>验收：<\/strong> 无配置时在启动阶段明确失败；注入合成配置时 fake 客户端只收到合成值；扫描输出仅报位置不泄露值；本轮没有执行轮换或改写历史。<\/p>\n<h3 id=\"rag-engineering-findings--f04--路径输入与索引选择没有授权约束\">F04 · 路径输入与索引选择没有授权约束<\/h3>\n<p><strong>位置：<\/strong> <code>router/chat_rt.py::upload_files<\/code>（49 行起）、<code>chat_on_docs<\/code>；<code>rag/nlp/search_v2.py::retrieval<\/code> 的 tenant_ids 拆分；<code>rag/utils/es_conn.py::search<\/code>。<\/p>\n<p><strong>触发与机制：<\/strong> 请求者能访问 API 时，session_id、filename 直接交给 os.path.join，未限制父目录/绝对路径；服务端没有 Depends 身份校验，session_id 又直接决定写入或查询索引。<strong>影响：<\/strong> 可越过预期会话目录写文件，范围受进程文件权限限制；可选择任意字符串作为检索命名空间，实际 ES 可访问数据范围未在线测试。随机 session ID 不是访问控制。<\/p>\n<p><strong>验证：<\/strong> P03 只在临时根下分别使用父路径片段，观察到文件落到预期子目录之外，HTTP 200，无真实文件破坏。API 三路由没有鉴权是静态确认。<\/p>\n<p><strong>修复方向：<\/strong> 服务端生成存储名；对解析后的路径做根内约束并防符号链接逃逸；通过用户/知识库映射选择索引，不接受任意索引表达式。<strong>验收：<\/strong> 父路径、绝对路径、另一用户知识库 ID 返回 4xx 且磁盘/ES 零副作用；合法中文文件名可作为展示元数据保留。<\/p>\n<h3 id=\"rag-engineering-findings--f05--es-错误未传播到用户成功状态\">F05 · ES 错误未传播到用户成功状态<\/h3>\n<p><strong>位置：<\/strong> <code>file_parse.py::execute_insert_process<\/code>（83 行起）；<code>rag/utils/es_conn.py::insert<\/code>（136 行起）；<code>router/chat_rt.py::upload_files<\/code>。<\/p>\n<p><strong>机制：<\/strong> ES bulk item 错误以列表返回，调用者忽略；非超时异常分支先 append 错误再将 res 清空，两轮后可返回 []；原文件写入没有回滚。<strong>影响：<\/strong> 用户看到成功但索引可能部分或完全没有写入。<strong>验证：<\/strong> P04 注入 bulk 错误列表仍 HTTP 200/success；P07 两次合成非超时异常最终返回 []。二者未接真实 ES。<\/p>\n<p><strong>修复方向：<\/strong> 定义 InsertResult 的成功数/失败项，明确重试边界；仅已发布的有效版本标为 ready，保留失败状态供重试。<strong>验收：<\/strong> 部分失败、认证失败、超时都不返回整体成功；相同操作重试不重复发布、不遗留错误可见版本。bulk 按项结果语义核对 <a href=\"https://www.elastic.co/guide/en/elasticsearch/reference/8.11/docs-bulk.html\">Elasticsearch 8.11 官方说明<\/a>。<\/p>\n<h3 id=\"rag-engineering-findings--f06--请求线程承担无界同步工作\">F06 · 请求线程承担无界同步工作<\/h3>\n<p><strong>位置：<\/strong> <code>router/chat_rt.py::upload_files/chat_on_docs<\/code>；<code>file_parse.py::execute_insert_process<\/code>。<strong>触发：<\/strong> 上传大文件、多文件，或模型/ES 较慢时，async 路由在 await 之后直接调用同步解析、逐块嵌入和检索，期间没有让出事件循环的应用级操作；文件 read 无 size 参数，客户端 5 MiB 限制可绕过。<\/p>\n<p><strong>影响与限制：<\/strong> 单个 worker 可被同步工作占用，内存需求随文件大小增长；没有测量耗尽、并发容量或实际延迟，不称为已发生泄漏。settings 中的 DOC_MAXIMUM_SIZE 没被上传入口使用。<\/p>\n<p><strong>修复方向：<\/strong> 首先服务端流式计数与配额、明确总超时；有界线程池隔离同步 I/O，CPU/OCR 有需要再迁到任务 worker。<strong>验收：<\/strong> 超限文件在阈值处停止写入；受控慢依赖下轻量请求可在明确预算内响应；取消后资源释放，并记录队列上限。<\/p>\n<h3 id=\"rag-engineering-findings--f07--格式分支接受路径却使用空-binary\">F07 · 格式分支接受路径却使用空 binary<\/h3>\n<p><strong>位置：<\/strong> <code>file_parse.py::parse<\/code>；<code>rag/app/naive.py::chunk<\/code> XLSX/JSON 分支；<code>deepdoc/parser/excel_parser.py::__call__<\/code> 与 <code>json_parser.py::__call__<\/code>。<\/p>\n<p><strong>触发与机制：<\/strong> 上传只传 file_path，binary 默认 None；XLSX 分支把 None 放进 BytesIO 后交 openpyxl，JSON 分支对 None 解码。<strong>验证：<\/strong> P06 在临时目录生成有效 xlsx/json，实际 chunk 路径得到 BadZipFile/AttributeError。<strong>影响：<\/strong> 这些格式不能通过当前路径入口，PDF/TXT 不据此判坏。<\/p>\n<p><strong>修复方向：<\/strong> 统一 parser 输入协议，显式传 filename 或读取 bytes；格式不支持时在写入昂贵存储前给 4xx。<strong>验收：<\/strong> 两格式用同一上传入口形成预期非空 chunk；损坏格式明确失败、不报告成功。旧 DOC 的 Tika 适配同样值得复查，但本轮未接线验证。<\/p>\n<h3 id=\"rag-engineering-findings--f08--内容哈希不能表达文档归属\">F08 · 内容哈希不能表达文档归属<\/h3>\n<p><strong>位置：<\/strong> <code>file_parse.py::process_item<\/code>（42 行起）、<code>es_conn.py::insert<\/code>。<strong>触发：<\/strong> 同 session 中两个文件含同一段落。<strong>机制：<\/strong> chunk hash 仅含内容和 session；ES 使用 index 同 ID 操作，第二份文档覆盖第一份的 doc_id/文档名。<strong>验证：<\/strong> P05 两个文件得到同一 chunk id 和不同 doc_id；实际 ES 覆盖未在线运行。<\/p>\n<p><strong>修复方向：<\/strong> 用文档稳定 ID、版本、chunk 序号确定身份；如确需内容去重，将内容实体与多文档归属分开。<strong>验收：<\/strong> 相同段落属于多个文件时保留全部来源；替换同名文档后旧版本不混入检索；失败版本不替换已发布版本。<\/p>\n<h3 id=\"rag-engineering-findings--f09--markdown-的-html-信任边界未建立\">F09 · Markdown 的 HTML 信任边界未建立<\/h3>\n<p><strong>位置：<\/strong> <code>frontend/src/components/markdown/index.tsx::Markdown<\/code>；调用点含聊天回答与引用 Drawer。<strong>触发：<\/strong> 模型输出或文档引用含原始 HTML/事件属性。<strong>机制：<\/strong> Marked.parse 结果未经清洗直接进入 dangerouslySetInnerHTML。<strong>证据：<\/strong> P10 对锁定 Marked 15.0.7 的合成字符串验证属性保留；未在浏览器执行攻击代码，也未读取真实 token。风险级别考虑浏览器用户状态同源可访问，不能据此声称凭据已被窃取。<\/p>\n<p><strong>修复方向：<\/strong> 采用严格标签/属性白名单，或禁用原始 HTML；同时保留需要的引用标记。<strong>验收：<\/strong> 合成危险属性与协议被移除，中文、表格、代码块和引用链接仍正确。官方明确 Markdown 解析并不提供 HTML 清洗：<a href=\"https://github.com/markedjs/marked\">Marked 文档<\/a>。<\/p>\n<h3 id=\"rag-engineering-findings--f10--流的错误结束与取消状态不对称\">F10 · 流的错误、结束与取消状态不对称<\/h3>\n<p><strong>位置：<\/strong> <code>chat.py::get_chat_completion<\/code>、<code>frontend/src/pages/chat/index.tsx::sendChat/read/parseData<\/code>。<strong>触发：<\/strong> 后端生成器发 event:error、模型非 stop 结束、用户离开页面。<strong>机制：<\/strong> 前端忽略 event/role，error content 被拼入 assistant 正文；end 不是必需终态；卸载不主动 cancel。<strong>验证：<\/strong> P09 用真实 parseData 函数收到 role:error 后，target.content 增加而 target.error 未设置。其他分支静态确认，未测供应商取消计费行为。<\/p>\n<p><strong>修复方向：<\/strong> 定义 message/documents/error/end 的状态机和总预算，绑定 AbortController/reader 生命周期；推荐问题失败不应抹去已完成答案。<strong>验收：<\/strong> 故障显示独立错误且保留已生成内容；所有结束原因有终态；中断可被追踪，不无条件自动重发整次付费请求。<\/p>\n<h3 id=\"rag-engineering-findings--f11--默认安装与质量门禁无法直接重现\">F11 · 默认安装与质量门禁无法直接重现<\/h3>\n<p><strong>位置：<\/strong> <code>frontend/package.json<\/code>、<code>package-lock.json<\/code>、<code>eslint.config.js<\/code> 及 lint 报告定位。<strong>验证：<\/strong> Node 24.21.0 下默认 <code>npm ci --ignore-scripts --no-audit --no-fund<\/code> 退出 1（ahooks 3.8.4 peer React ≤18 与 React 19 冲突）。在隔离副本用 legacy peer 模式后构建成功；lint 退出 1，26 errors、10 warnings。<\/p>\n<p><strong>影响：<\/strong> 新环境默认安装不通，门禁不能直接作为绿色基线；并不证明 React 19 在所有 UI 场景运行失败。<strong>修复方向：<\/strong> 选择相互支持的依赖组合并锁定 Node/npm，修复或有理由地调整规则；不将忽略 peer 作为默认质量结论。<strong>验收：<\/strong> 干净检出默认安装、build、lint 都成功，核心 React hooks/stream 行为有回归覆盖。<\/p>\n<h3 id=\"rag-engineering-findings--f12--启动与发布依赖隐含本机条件\">F12 · 启动与发布依赖隐含本机条件<\/h3>\n<p><strong>位置：<\/strong> <code>backend/app/Dockerfile<\/code>、<code>docker-compose.yml<\/code>、<code>nginx_certbot/https.conf<\/code>、<code>start_backend.sh<\/code>、<code>rag/nlp/rag_tokenizer.py<\/code>、<code>deepdoc/parser/pdf_parser.py<\/code>。<\/p>\n<p><strong>机制与前提：<\/strong> 自定义基础镜像来源缺失；模型/NLP 资源需要外部准备；后端关键 SDK 版本未锁定；ES 客户端固定使用 Compose DNS，与宿主机启动方式不天然相容；单独 Nginx 目标端口与当前主机映射不一致。<strong>影响：<\/strong> 新机器或把零散配置拼为部署时可能启动失败、降级分词或不能转发 API。只确认配置差异，没有做 Docker 构建、DNS/端口实测。<\/p>\n<p><strong>修复方向：<\/strong> 定义一种可复现开发方式和一种部署拓扑；统一 Settings、固定依赖/资源摘要、startup/readiness 自检与部署契约。<strong>验收：<\/strong> 空缓存环境按文档启动，缺资源可诊断；API→ES、代理→API 与 SSE 首帧实测；不要求本轮新增部署基础设施。<\/p>\n<h3 id=\"rag-engineering-findings--待确认与覆盖限制\">待确认与覆盖限制<\/h3>\n<p>Q01：重排适配器是否按得分重新排序、分数与候选 ID 是否错配。P08 仅验证此返回顺序下当前包装会丢身份；实际 <code>llama-index-postprocessor-dashscope-rerank-custom<\/code> 没有锁定版本，本轮不下载调用供应商，不能列为已证实生产排序缺陷。<\/p>\n<p>没有执行线上负载、OCR 质量评测、模型输出正确性或真实 ES 写入。本轮不对所有内嵌 DeepDOC 算法作全仓安全审计，也不把尚未接线的 eval/演示代码认定为当前 HTTP 可达漏洞。<\/p>\n<p>本地 <code>evidence/probe_backend.py<\/code>、<code>probe_frontend.cjs<\/code> 与两份 results.json 保存小型复现；探针断言的是缺陷存在，修复后应改成正确行为的回归测试。证据附件只留项目本地，不随六篇公开正文上传；正文已包含触发条件、结果和边界。<\/p>","outline":[{"lvl":1,"text":"rag · 工程问题清单","id":"rag-engineering-findings--rag--工程问题清单"},{"lvl":2,"text":"判级与证据规则","id":"rag-engineering-findings--判级与证据规则"},{"lvl":2,"text":"F01 · 登录与历史接口缺失","id":"rag-engineering-findings--f01--登录与历史接口缺失"},{"lvl":2,"text":"F02 · 文件写入 default，聊天查随机 session","id":"rag-engineering-findings--f02--文件写入-default聊天查随机-session"},{"lvl":2,"text":"F03 · 配置与凭据边界失效","id":"rag-engineering-findings--f03--配置与凭据边界失效"},{"lvl":2,"text":"F04 · 路径输入与索引选择没有授权约束","id":"rag-engineering-findings--f04--路径输入与索引选择没有授权约束"},{"lvl":2,"text":"F05 · ES 错误未传播到用户成功状态","id":"rag-engineering-findings--f05--es-错误未传播到用户成功状态"},{"lvl":2,"text":"F06 · 请求线程承担无界同步工作","id":"rag-engineering-findings--f06--请求线程承担无界同步工作"},{"lvl":2,"text":"F07 · 格式分支接受路径却使用空 binary","id":"rag-engineering-findings--f07--格式分支接受路径却使用空-binary"},{"lvl":2,"text":"F08 · 内容哈希不能表达文档归属","id":"rag-engineering-findings--f08--内容哈希不能表达文档归属"},{"lvl":2,"text":"F09 · Markdown 的 HTML 信任边界未建立","id":"rag-engineering-findings--f09--markdown-的-html-信任边界未建立"},{"lvl":2,"text":"F10 · 流的错误、结束与取消状态不对称","id":"rag-engineering-findings--f10--流的错误结束与取消状态不对称"},{"lvl":2,"text":"F11 · 默认安装与质量门禁无法直接重现","id":"rag-engineering-findings--f11--默认安装与质量门禁无法直接重现"},{"lvl":2,"text":"F12 · 启动与发布依赖隐含本机条件","id":"rag-engineering-findings--f12--启动与发布依赖隐含本机条件"},{"lvl":2,"text":"待确认与覆盖限制","id":"rag-engineering-findings--待确认与覆盖限制"}],"words":3637,"read":9},{"id":"rag-optimization-roadmap","cat":"backend-eng","title":"rag · 优化路线图","summary":"依据审查问题分阶段建议实施安全边界、使用闭环、可信状态与可复现部署，并定义迁移和验证策略。","tags":["rag","工程审查","FastAPI","React","Elasticsearch"],"kicker":"rag 工程审查 · 04/06 · 2026-10-13 · 37ac973 / 3c4cd2a / 56fe651","order":8,"html":"<h2 id=\"rag-optimization-roadmap--rag--优化路线图\">rag · 优化路线图<\/h2>\n<p>审查日期：2026-10-13（Asia/Shanghai）。项目：<code>NicholasZhao-zhenglin/rag<\/code>；总仓库 <code>37ac973e4580442542853bb241e3286caa90dfc3<\/code>，后端 <code>3c4cd2ac1f11c862e31f423054cbef7b3960c7b8<\/code>，前端 <code>56fe6519426174e1b6d8f421bdbeb92e742cc4a4<\/code>。下文完整源码路径相对于 rag 根目录；短路径承接已给出的完整定位：后端入口/路由位于 <code>backend/app/<\/code>，解析、检索、模型及 <code>rag/<\/code>、<code>deepdoc/<\/code> 位于 <code>backend/app/service/ragflow/<\/code>，前端模块位于 <code>frontend/src/<\/code>。审查和隔离验证已执行；业务修复与路线图均未实施。<\/p>\n<p>阅读顺序：<a href=\"index.html#/a/rag-system-architecture\">01 系统架构分析<\/a> → <a href=\"index.html#/a/rag-core-call-chains\">02 核心代码调用链<\/a> → <a href=\"index.html#/a/rag-engineering-findings\">03 工程问题清单<\/a> → <a href=\"index.html#/a/rag-optimization-roadmap\">04 优化路线图<\/a> → <a href=\"index.html#/a/rag-engineering-handbook\">05 工程知识学习手册<\/a> → <a href=\"index.html#/a/rag-interview-questions\">06 面试问答手册<\/a>。<\/p>\n<h3 id=\"rag-optimization-roadmap--目标与排序依据\">目标与排序依据<\/h3>\n<p>以下全部是<strong>建议实施<\/strong>，本轮仅完成审查与离线验证。当前最重要的目标是让一个授权用户完成“进入页面→上传文档→基于正确集合回答→失败可见”的闭环，再讨论吞吐量。没有真实负载与检索质量基线，不给出提升倍数、并发人数或固定工期。<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>具体交付<\/th>\n<th>对应问题<\/th>\n<th>前置依赖<\/th>\n<th>可观察退出条件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A：建立信任与输入边界<\/td>\n<td>清除凭据 fallback、服务器身份/知识库授权、路径约束、Markdown 清洗<\/td>\n<td>F03/F04/F09<\/td>\n<td>确定单用户还是多用户产品边界<\/td>\n<td>未授权/越界输入无副作用，合成 HTML 不执行，配置缺失 fail fast<\/td>\n<\/tr>\n<tr>\n<td>B：打通最小使用链<\/td>\n<td>定义会话与知识库 ID、实现准入及历史契约或明确精简 UI、统一上传解析输入<\/td>\n<td>F01/F02/F07<\/td>\n<td>A 的身份与数据归属<\/td>\n<td>干净浏览器完成上传问答；刷新/不支持功能有明确行为<\/td>\n<\/tr>\n<tr>\n<td>C：让状态可信<\/td>\n<td>bulk 错误结构、文件版本/chunk 身份、索引 ready 发布、SSE 终态与取消<\/td>\n<td>F05/F08/F10<\/td>\n<td>B 的 ID 与接口契约<\/td>\n<td>故障不报成功、旧版本可继续读取、流错误不冒充正文<\/td>\n<\/tr>\n<tr>\n<td>D：可复现与有界执行<\/td>\n<td>peer 依赖、lint、运行资源清单、统一配置、上传配额、有界执行器<\/td>\n<td>F06/F11/F12<\/td>\n<td>A–C 的回归用例<\/td>\n<td>默认安装/构建/检查通过；慢任务不无界占用；部署拓扑实测<\/td>\n<\/tr>\n<tr>\n<td>E：质量与规模演进<\/td>\n<td>带标注语料评测、重排顺序契约测试，再决定队列与 worker<\/td>\n<td>Q01 与产品目标<\/td>\n<td>可靠闭环与测量系统<\/td>\n<td>指标可重复，能解释错误归因；升级由瓶颈触发<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A 与默认安装整理可以并行推进，但先修某个 npm 报错不能替代后端闭环。每阶段应是可独立评审的小变更，不把所有问题捆绑为框架重写。<\/p>\n<h3 id=\"rag-optimization-roadmap--建议接口与状态模型未实施\">建议接口与状态模型（未实施）<\/h3>\n<p>将 conversation_id 表示会话、knowledge_base_id 表示资料集合、document_id 表示文件逻辑身份、version 表示一次发布、job_id 表示处理执行。服务端从授权上下文决定存储边界，浏览器不直接决定 ES 索引表达式。小型单用户部署可以先用简单持久化实现，不能因此跳过状态契约。<\/p>\n<pre><code class=\"language-mermaid\">flowchart LR\n  U[授权上传] --&gt; V[输入与配额检查]\n  V --&gt; S[staged 文件版本]\n  S --&gt; W[有界解析与嵌入]\n  W --&gt; I[写入未发布索引版本]\n  I --&gt; R[验证成功并标记 ready]\n  R --&gt; Q[检索只读 ready 版本]\n  W --&gt; F[failed 可诊断状态]\n  I --&gt; F\n<\/code><\/pre>\n<p>这是建议的数据发布顺序，不是当前代码已有队列。可先同步执行 W，但所有失败仍需留下可靠的状态；若引入后台 worker，任务状态与重复执行幂等性先于队列技术选型。<\/p>\n<p>建议 SSE 事件携带 request_id、type、payload 和终态；error 是业务事件，不等于追加一段回答。客户端离开页面应主动取消传输，服务器再按 SDK 能力关闭流；记录哪些边界只能停止本地消费，不能保证供应商立即停止生成。<\/p>\n<h3 id=\"rag-optimization-roadmap--关键决策与取舍\">关键决策与取舍<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>决策<\/th>\n<th>保留现状的代价<\/th>\n<th>最小可行改造<\/th>\n<th>进一步升级的触发信号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>同步解析还是任务队列<\/td>\n<td>worker 被长任务占用，失败不可追踪<\/td>\n<td>有界线程/进程执行器与 job 状态<\/td>\n<td>长任务显著超过请求预算，需要重启恢复或跨机扩容<\/td>\n<\/tr>\n<tr>\n<td>session 对应 ES 索引<\/td>\n<td>文档集合与对话生命周期耦合，索引数量增长<\/td>\n<td>显式知识库 ID 与服务端归属映射<\/td>\n<td>测得分片开销后比较共享索引+严格过滤；不预先强制迁移<\/td>\n<\/tr>\n<tr>\n<td>chunk 内容去重<\/td>\n<td>丢失多文档来源<\/td>\n<td>doc/version/chunk ordinal 作为写入 ID<\/td>\n<td>重复存储成为真实成本后再引入内容实体与归属关联<\/td>\n<\/tr>\n<tr>\n<td>上传成功定义<\/td>\n<td>bulk 调用结束不等于可检索<\/td>\n<td>检查失败项、刷新/可见性策略与 ready 状态<\/td>\n<td>大批量下测量 refresh 成本，再设计批次发布<\/td>\n<\/tr>\n<tr>\n<td>认证产品还是内部演示<\/td>\n<td>UI 与 API 能力不一致<\/td>\n<td>明确契约；不可用功能显式隐藏或实现<\/td>\n<td>多用户共享资料时必须做服务端授权与审计<\/td>\n<\/tr>\n<tr>\n<td>模型与检索配置<\/td>\n<td>硬编码难复现、缺总预算<\/td>\n<td>一个配置对象与 typed gateway<\/td>\n<td>多供应商差异真实出现后再增适配器<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"rag-optimization-roadmap--迁移与回退\">迁移与回退<\/h3>\n<p>F02/F08 涉及标识和存量索引。先记录旧 session/index 与文件清单，仅对可确认归属的数据建立映射；无会话表的旧数据不能猜测所有者。新 schema 写入新版本或新命名空间，离线比对文件数、chunk 数、内容摘要与引用归属；通过后切读，旧索引保留到确认回滚窗口结束。不要就地删旧块后再做高风险重建。<\/p>\n<p>接口变更可暂时接受旧字段，但由服务器解析为明确的知识库关系并告警；禁止“兼容模式”重新开放任意索引选择。回退应能切回旧发布指针并暂停新写入；凭据轮换与撤销旧凭据不能当作可随意回退的状态，旧秘密不得恢复到源码。<\/p>\n<h3 id=\"rag-optimization-roadmap--需要测量什么\">需要测量什么<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>测量位置<\/th>\n<th>如何确定目标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>文档可见成功率、失败原因<\/td>\n<td>upload/job 状态与 ES 验证<\/td>\n<td>以合成 fixture 完全正确为门槛，再测真实格式<\/td>\n<\/tr>\n<tr>\n<td>首帧与完成延迟<\/td>\n<td>请求、检索、答案流、推荐请求分别打点<\/td>\n<td>按交互预算设分位数目标，不拿构建时间当响应速度<\/td>\n<\/tr>\n<tr>\n<td>峰值内存、活动任务、排队时间<\/td>\n<td>有界执行器与 worker<\/td>\n<td>从最大允许文件/页数和机器预算推导<\/td>\n<\/tr>\n<tr>\n<td>命中、引用准确率、拒答率<\/td>\n<td>标注问题/文档集<\/td>\n<td>冻结语料与模型版本，人工判定少量困难样本<\/td>\n<\/tr>\n<tr>\n<td>超时与取消后的活跃请求<\/td>\n<td>gateway 与客户端流<\/td>\n<td>假网关可观察资源关闭；真实 SDK 再做授权集成<\/td>\n<\/tr>\n<tr>\n<td>文档重传幂等性<\/td>\n<td>同一 document/version 重试<\/td>\n<td>chunk/归属不重复，旧版本不混入<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"rag-optimization-roadmap--验证矩阵与推广\">验证矩阵与推广<\/h3>\n<p>先把本轮缺陷探针转为期望正确行为的回归：P01/P02 验证契约与资料集合，P03 验证根内路径与授权，P04/P07 注入部分失败/不可用，P05 检查文档归属，P06 走完整格式入口，P09/P10 检查流与 HTML 边界。P08 加上真实适配器固定版本的节点身份顺序测试后才关闭 Q01。<\/p>\n<p>下一层是独立临时 ES 的集成，测试 bulk 部分失败与 refresh 可见性；再是使用合成文档、受控模型假服务的浏览器端到端。最后才运行真实模型与部署检查，明确预算、资源与数据范围。生产压测不是本轮检查的隐含授权。<\/p>\n<p>问题关闭必须记录修复提交、回归命令、环境和失败路径结果，更新 03 状态、01/02 当前行为与根目录交接文件。不要用“探针仍然复现旧 bug”作为修复验收，也不要把方案写成已上线成果。<\/p>","outline":[{"lvl":1,"text":"rag · 优化路线图","id":"rag-optimization-roadmap--rag--优化路线图"},{"lvl":2,"text":"目标与排序依据","id":"rag-optimization-roadmap--目标与排序依据"},{"lvl":2,"text":"建议接口与状态模型（未实施）","id":"rag-optimization-roadmap--建议接口与状态模型未实施"},{"lvl":2,"text":"关键决策与取舍","id":"rag-optimization-roadmap--关键决策与取舍"},{"lvl":2,"text":"迁移与回退","id":"rag-optimization-roadmap--迁移与回退"},{"lvl":2,"text":"需要测量什么","id":"rag-optimization-roadmap--需要测量什么"},{"lvl":2,"text":"验证矩阵与推广","id":"rag-optimization-roadmap--验证矩阵与推广"}],"words":2116,"read":5},{"id":"rag-engineering-handbook","cat":"backend-eng","title":"rag · 工程知识学习手册","summary":"借本项目的版本契约、文档身份、并发、批量提交、解析适配和流状态讲解工程机制，附建议练习。","tags":["rag","工程审查","FastAPI","React","Elasticsearch"],"kicker":"rag 工程审查 · 05/06 · 2026-10-13 · 37ac973 / 3c4cd2a / 56fe651","order":9,"html":"<h2 id=\"rag-engineering-handbook--rag--工程知识学习手册\">rag · 工程知识学习手册<\/h2>\n<p>审查日期：2026-10-13（Asia/Shanghai）。项目：<code>NicholasZhao-zhenglin/rag<\/code>；总仓库 <code>37ac973e4580442542853bb241e3286caa90dfc3<\/code>，后端 <code>3c4cd2ac1f11c862e31f423054cbef7b3960c7b8<\/code>，前端 <code>56fe6519426174e1b6d8f421bdbeb92e742cc4a4<\/code>。下文完整源码路径相对于 rag 根目录；短路径承接已给出的完整定位：后端入口/路由位于 <code>backend/app/<\/code>，解析、检索、模型及 <code>rag/<\/code>、<code>deepdoc/<\/code> 位于 <code>backend/app/service/ragflow/<\/code>，前端模块位于 <code>frontend/src/<\/code>。审查和隔离验证已执行；业务修复与路线图均未实施。<\/p>\n<p>阅读顺序：<a href=\"index.html#/a/rag-system-architecture\">01 系统架构分析<\/a> → <a href=\"index.html#/a/rag-core-call-chains\">02 核心代码调用链<\/a> → <a href=\"index.html#/a/rag-engineering-findings\">03 工程问题清单<\/a> → <a href=\"index.html#/a/rag-optimization-roadmap\">04 优化路线图<\/a> → <a href=\"index.html#/a/rag-engineering-handbook\">05 工程知识学习手册<\/a> → <a href=\"index.html#/a/rag-interview-questions\">06 面试问答手册<\/a>。<\/p>\n<h3 id=\"rag-engineering-handbook--受众与学习路线\">受众与学习路线<\/h3>\n<p>适合了解 Python、TypeScript 和基本 HTTP、准备接手此 RAG 原型的工程师。建议先读 01 看边界，再沿 02 的一次上传/聊天走源码，遇到问题到 03 查证据，最后比较 04 的方案。本手册的练习全部是<strong>建议练习，尚未执行<\/strong>；本轮已执行的探针有单独编号。<\/p>\n<h3 id=\"rag-engineering-handbook--1-版本组合也是系统的一部分\">1. 版本组合也是系统的一部分<\/h3>\n<p>总仓库 main 并不代表两个子模块各自最新 main。<code>.gitmodules<\/code> 给远程身份，gitlink 给提交身份；要重现一个问题必须同时记录三个 SHA。本项目的后端缺登录而前端默认要求登录，说明各自存在文件不能保证组合契约成立。<\/p>\n<p>不变量是“被部署的前端每个请求，都能在其配套后端找到约定行为”。单看前端 TypeScript 编译不会验证 HTTP 路由。短期用 API 清单对照 OpenAPI，长期可由 schema 生成客户端，但生成类型也不代替业务授权与状态测试。<\/p>\n<p>建议练习：从 <code>frontend/src/api<\/code> 提取 method/path，与隔离后端路由表比较；预期观察四个缺失接口。修复后同一检查应为空，并保留未知路径 404 的反例。<\/p>\n<h3 id=\"rag-engineering-handbook--2-文档身份会话身份与检索空间\">2. 文档身份、会话身份与检索空间<\/h3>\n<p><code>create_session<\/code> 返回随机字符串，而上传默认用 default；两者只是名字，代码没有建立归属关系。F02 展示了“每段函数各自运行成功，整个操作仍然失败”。<\/p>\n<p>另一个身份问题在 <code>file_parse.process_item<\/code>：内容哈希能回答两段内容是否一样，不能回答它们来自哪份文件。F08 中两份文档的同段内容会落到相同 ES _id。可用 doc/version/chunk 序号表达归属；如果想省空间，需要一个内容实体对应多条来源关系，而非覆盖文档元数据。<\/p>\n<p>建议练习：制作两份各含共享段落与独特段落的合成 TXT，设计预期引用集合；验证去重与不去重两种模型对删除、替换、引用的影响。只用 fake 存储或临时索引，不碰现有资料。<\/p>\n<h3 id=\"rag-engineering-handbook--3-async-是协作等待不是自动搬走工作\">3. async 是协作等待，不是自动搬走工作<\/h3>\n<p>在 <code>chat_rt.upload_files<\/code> 中 await file.read 结束后，普通函数 execute_insert_process 仍在当前调用上下文执行；<code>chat_on_docs<\/code> 的 retrieve_content 同理。async 声明不会让同步 SDK、OCR 自动变成并行任务。官方说明也区分框架调度的普通路径函数和你自己直接调用的工具函数：<a href=\"https://fastapi.tiangolo.com/async/\">FastAPI 并发说明<\/a>。<\/p>\n<p>StreamingResponse 又是另一层：当前验证环境 Starlette 用线程池迭代同步 generator。因此不能只看一个 async 关键字就断言整条流都在事件循环里。先标清边界，再决定异步 SDK、线程池或独立 worker；线程池能缓解阻塞，不会免费提供持久任务、无限并发或崩溃恢复。<\/p>\n<p>建议练习：用 Event 控制一个 fake 同步 gateway，在单 worker 测试里同时发轻量请求，记录它何时开始；把外部调用迁入有界执行器后比较。不要使用真实慢接口，不用任意长 sleep 推断容量。<\/p>\n<h3 id=\"rag-engineering-handbook--4-成功必须跨越所有需要的提交边界\">4. 成功必须跨越所有需要的提交边界<\/h3>\n<p>文件保存、向量计算、bulk 接收、每项写入成功、搜索可见是五个不同事实。本项目 F05 在“bulk 返回错误列表”与“HTTP 报成功”之间丢了信息。Elasticsearch 官方 bulk 文档说明响应要检查 errors 和 items；这支持检查逐项结果，并不意味着数据库与文件系统自动有分布式事务。<\/p>\n<p>最小改造是明确 InsertResult 与 ready 状态；更严格的发布方案可以用版本指针，让读者只看到完整版本。代价是额外状态、存量清理和回滚流程。没有任务状态时，先加一个真实可信的状态机，比先接复杂消息队列更有价值。<\/p>\n<p>建议练习：fake bulk 对三块中的第二块失败；画出原文件、三块、UI 状态的实际值。设计重试规则，要求重复调用不把失败结果发布为 ready，也不丢掉先前已可读版本。<\/p>\n<h3 id=\"rag-engineering-handbook--5-适配器的输入与输出都必须保留语义\">5. 适配器的输入与输出都必须保留语义<\/h3>\n<p>F07 不是“openpyxl 不能解析 Excel”，而是 <code>naive.chunk<\/code> 接收路径却把 None 传给 ExcelParser。真实库收到空 BytesIO 后报 BadZipFile 完全合理。JSON 同样缺少 binary。修复时必须沿入口跟到底，不能只给下游加 try/except 并返回空列表。<\/p>\n<p>输出侧 Q01 是身份丢失：重排服务若按分数换序返回节点，包装只取分数，调用者又按旧顺序应用，就把 B 的分数给了 A。即使数组长度一致也不代表对应关系正确。本轮只用合成换序 fake 证明这一前提下的风险，未验证自定义包真实返回约定。<\/p>\n<p>建议练习：让适配器接收带 ID 的 A、B、C 并返回 C、A、B；断言 ID 与 score 始终成对传递。为格式入口规定明确的 Path/bytes 类型，拒绝隐式 None。<\/p>\n<h3 id=\"rag-engineering-handbook--6-流式接口是状态协议\">6. 流式接口是状态协议<\/h3>\n<p>普通 JSON 请求通常一次成功或失败；SSE 可以先成功发引用、再发半段答案、最后失败。HTTP 200 不代表生成成功，后端 event:error 也不会自动触发 Axios 的非 2xx 错误插件。F10 的 parseData 只看到 content，就把错误当答案。<\/p>\n<p>不变量是消息有明确的开始、增量、失败或完成状态，且资源在终态释放。推荐问题是另一次模型调用，应有独立降级策略。客户端取消、服务端停止读取、供应商停止生成是不同动作，不能用一个 AbortController 宣称计费一定立刻终止。<\/p>\n<p>建议练习：输入 documents→content→error、content→end、自然 EOF 三种假流，分别断言正文、错误、loading 和资源关闭次数。测试流分包时不要假设一次 read 就是一条 SSE 事件。<\/p>\n<h3 id=\"rag-engineering-handbook--7-markdown-格式化和安全清洗不同\">7. Markdown 格式化和安全清洗不同<\/h3>\n<p><code>components/markdown<\/code> 把模型/文档内容送到 Marked，再直接注入 DOM。Markdown parser 负责语法转换，不是 HTML 安全策略。P10 用无破坏的合成属性证明当前版本保留 HTML；Marked 官方也明确要求独立清洗：<a href=\"https://github.com/markedjs/marked\">Marked 文档<\/a>。<\/p>\n<p>方案取舍是保留富文本功能与缩小 HTML 能力：只允许段落、表格和代码时可以严格白名单；如果允许外链/图片，需要协议、属性和资源来源规则。纯字符串替换几类危险词无法替代结构化清洗。<\/p>\n<p>建议练习：建立安全 HTML fixture 集，用 DOM 断言验证危险属性被移除，同时表格与引用可用；仅在本地空白页面，不读取或发送浏览器用户信息。<\/p>\n<h3 id=\"rag-engineering-handbook--8-可复现验证的四层证据\">8. 可复现验证的四层证据<\/h3>\n<p>本轮 60 个 Python 文件语法通过，只说明可解析；AST 探针证明选定函数在 fake 边界下的行为；前端 legacy peer 模式下 build 成功，只说明特定环境能产物；真实 ES/模型/部署尚未验证。这四层不能互相替代。<\/p>\n<p>默认 npm ci 失败与 legacy 模式成功也不是矛盾：前者检查 peer 契约，后者主动放宽该检查。lint 26 errors/10 warnings 是现有门禁状态，不能用 build 成功掩盖。后端无完整锁文件意味着本轮小型 probe 环境也不能冒充生产环境。<\/p>\n<p>建议练习：为一条结论写四行证据台账：源码位置、明确前提、实际命令/观察、未覆盖边界。然后把建议测试和真实执行分开。学习完成的标准是能够解释失败原因和验证限度，而不是背出组件名字。<\/p>","outline":[{"lvl":1,"text":"rag · 工程知识学习手册","id":"rag-engineering-handbook--rag--工程知识学习手册"},{"lvl":2,"text":"受众与学习路线","id":"rag-engineering-handbook--受众与学习路线"},{"lvl":2,"text":"1. 版本组合也是系统的一部分","id":"rag-engineering-handbook--1-版本组合也是系统的一部分"},{"lvl":2,"text":"2. 文档身份、会话身份与检索空间","id":"rag-engineering-handbook--2-文档身份会话身份与检索空间"},{"lvl":2,"text":"3. async 是协作等待，不是自动搬走工作","id":"rag-engineering-handbook--3-async-是协作等待不是自动搬走工作"},{"lvl":2,"text":"4. 成功必须跨越所有需要的提交边界","id":"rag-engineering-handbook--4-成功必须跨越所有需要的提交边界"},{"lvl":2,"text":"5. 适配器的输入与输出都必须保留语义","id":"rag-engineering-handbook--5-适配器的输入与输出都必须保留语义"},{"lvl":2,"text":"6. 流式接口是状态协议","id":"rag-engineering-handbook--6-流式接口是状态协议"},{"lvl":2,"text":"7. Markdown 格式化和安全清洗不同","id":"rag-engineering-handbook--7-markdown-格式化和安全清洗不同"},{"lvl":2,"text":"8. 可复现验证的四层证据","id":"rag-engineering-handbook--8-可复现验证的四层证据"}],"words":2214,"read":5},{"id":"rag-interview-questions","cat":"backend-eng","title":"rag · 面试问答手册","summary":"围绕真实架构和证据组织 13 组面试问答，明确区分审查、隔离复现、建议方案与生产验证。","tags":["rag","工程审查","FastAPI","React","Elasticsearch"],"kicker":"rag 工程审查 · 06/06 · 2026-10-13 · 37ac973 / 3c4cd2a / 56fe651","order":10,"html":"<h2 id=\"rag-interview-questions--rag--面试问答手册\">rag · 面试问答手册<\/h2>\n<p>审查日期：2026-10-13（Asia/Shanghai）。项目：<code>NicholasZhao-zhenglin/rag<\/code>；总仓库 <code>37ac973e4580442542853bb241e3286caa90dfc3<\/code>，后端 <code>3c4cd2ac1f11c862e31f423054cbef7b3960c7b8<\/code>，前端 <code>56fe6519426174e1b6d8f421bdbeb92e742cc4a4<\/code>。下文完整源码路径相对于 rag 根目录；短路径承接已给出的完整定位：后端入口/路由位于 <code>backend/app/<\/code>，解析、检索、模型及 <code>rag/<\/code>、<code>deepdoc/<\/code> 位于 <code>backend/app/service/ragflow/<\/code>，前端模块位于 <code>frontend/src/<\/code>。审查和隔离验证已执行；业务修复与路线图均未实施。<\/p>\n<p>阅读顺序：<a href=\"index.html#/a/rag-system-architecture\">01 系统架构分析<\/a> → <a href=\"index.html#/a/rag-core-call-chains\">02 核心代码调用链<\/a> → <a href=\"index.html#/a/rag-engineering-findings\">03 工程问题清单<\/a> → <a href=\"index.html#/a/rag-optimization-roadmap\">04 优化路线图<\/a> → <a href=\"index.html#/a/rag-engineering-handbook\">05 工程知识学习手册<\/a> → <a href=\"index.html#/a/rag-interview-questions\">06 面试问答手册<\/a>。<\/p>\n<h3 id=\"rag-interview-questions--使用方式\">使用方式<\/h3>\n<p>这份问答用于围绕真实项目组织回答。参考回答描述本次审查见到的代码和证据；没有实施或上线的方案，应明确说“我建议”，不能改写成已完成的项目经验。<\/p>\n<h3 id=\"rag-interview-questions--1-用两分钟介绍系统\">1. 用两分钟介绍系统<\/h3>\n<p><strong>参考回答：<\/strong> rag 是锁定前后端子模块的文档问答原型。React 19 页面通过 Axios 调 FastAPI，上传文件后在服务进程同步解析、切块、远程向量化，再 bulk 写 Elasticsearch；聊天对查询做嵌入、全文/向量召回与重排，取引用后流式生成答案和推荐问题。目前不是完整多用户平台：登录/历史接口缺失，上传与新会话的索引命名不一致。审查记录三个提交，并用离线探针验证关键断点。<\/p>\n<p><strong>追问/误答：<\/strong> “用了 RAGFlow 目录就是部署了 RAGFlow 服务吗？”不是，默认链调用内嵌解析/NLP 代码，HTTP 适配器未接线。\n<strong>依据：<\/strong> <code>.gitmodules<\/code>、<code>app_main.py<\/code>、<code>chat_rt.py<\/code>、01 模块表。<\/p>\n<h3 id=\"rag-interview-questions--2-最值得保留的设计是什么\">2. 最值得保留的设计是什么？<\/h3>\n<p><strong>参考回答：<\/strong> 解析、检索、生成与路由有明确的文件级入口，适合建立 gateway 替换外部依赖；子模块提交锁定利于复现；SSE 使用 json.dumps 编码，前端通过 finally 清理 loading。这些是局部保障。我会在保留这些边界的基础上修正契约，不先拆微服务。<\/p>\n<p><strong>追问/误答：<\/strong> 模块拆文件不等于网络隔离，也不自动提供事务。需要进一步检查状态由谁持有。\n<strong>依据：<\/strong> <code>file_parse.py<\/code>、<code>retrieval.py<\/code>、<code>chat.py<\/code>、<code>pages/chat/index.tsx::sendChat<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--3-为什么文件上传成功聊天却查不到\">3. 为什么文件上传成功，聊天却查不到？<\/h3>\n<p><strong>参考回答：<\/strong> 当前前端上传不传 session_id，后端写 default；聊天主页新建随机 session，检索用它作为索引名，中间没有关联。P02 捕获真实路由实参证明两者不同。另一个独立原因是 F05：bulk 错误列表被丢弃。所以不能只凭页面 success 排查模型效果，应先验证集合身份与数据确实可见。<\/p>\n<p><strong>追问/误答：<\/strong> “把相似度阈值调低就行”不能解决命名空间不一致。\n<strong>依据：<\/strong> F02/F05；<code>api/session.ts::upload/chat<\/code>、<code>execute_insert_process<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--4-会话-id-能否充当访问控制\">4. 会话 ID 能否充当访问控制？<\/h3>\n<p><strong>参考回答：<\/strong> UUID 降低猜测概率，但服务器仍要判断当前用户是否有权访问这个资料集合。本后端既没有鉴权依赖，又直接用 session_id 拼目录和选索引。P03 仅在临时目录验证父路径越界。最小修复是服务端授权映射、生成存储名和根内路径检查，而不是仅增加随机字符串长度。<\/p>\n<p><strong>追问/误答：<\/strong> 前端 AuthGuard 只检查本地 token，不能保护直接 HTTP 调用。\n<strong>依据：<\/strong> F04、<code>AuthGuard<\/code>、<code>upload_files<\/code>、<code>ESConnection.search<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--5-什么是上传的成功\">5. 什么是上传的“成功”？<\/h3>\n<p><strong>参考回答：<\/strong> 至少要分文件落盘、处理成功、bulk 每项成功、可检索发布四步。当前 ES insert 返回错误列表而上层忽略，P04 表明合成失败仍返回 success；P07 表明非超时异常被清空。建议引入明确结果与 ready 状态，只有完整版本被发布才告知可用于问答。版本发布会增加状态和清理成本，但使失败可恢复。<\/p>\n<p><strong>追问/误答：<\/strong> HTTP 200 或 bulk 请求返回，都不能单独证明全部文档正确写入。\n<strong>依据：<\/strong> F05；<code>es_conn.py::insert<\/code>、<code>file_parse.py::execute_insert_process<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--6-为何用了-async-仍可能阻塞\">6. 为何用了 async 仍可能阻塞？<\/h3>\n<p><strong>参考回答：<\/strong> async 路由中直接调用普通解析和同步网络函数，不会自动切换执行器。上传 await read 后和聊天检索阶段都如此。流生成器被 StreamingResponse 迭代是另一层，本轮 Starlette 用线程池适配，不能混为一谈。建议先设资源上限和有界隔离，再根据 CPU、I/O 与恢复需求选择线程、进程或 worker。<\/p>\n<p><strong>追问/误答：<\/strong> 多开 worker 不能补齐任务状态，可能复制模型内存；本轮没有容量测量。\n<strong>依据：<\/strong> F06、02 执行上下文、05 第 3 节。<\/p>\n<h3 id=\"rag-interview-questions--7-混合检索默认链是什么\">7. 混合检索默认链是什么？<\/h3>\n<p><strong>参考回答：<\/strong> query 转分词文本条件和嵌入向量，ES 构造全文与 knn，再候选重排，最终返回最多五条。page_size=5 不等于只召回五条；当前候选 size 至少 128。embd_mdl=None 也不会跳过远程 embedding，因为旧分支已注释。召回、重排和答案生成应分开评估。<\/p>\n<p><strong>追问/误答：<\/strong> 能否证明排序正确？本轮没有标注语料评测；Q01 还需核实真实重排返回身份顺序。\n<strong>依据：<\/strong> <code>retrieval.py::retrieve_content<\/code>、<code>search_v2.py::search/retrieval<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--8-重排包装为什么可能出错\">8. 重排包装为什么可能出错？<\/h3>\n<p><strong>参考回答：<\/strong> 输入 A、B，适配器可能按得分返回 B、A；包装仅输出 score 数组，调用者继续按 A、B 取值，可能给错对象。P08 用换序假适配器演示了这一前提，但没有安装验证自定义包返回行为，所以我把它列为待确认 Q01。修复方向是 ID 和 score 一起传播，或显式映射回输入顺序。<\/p>\n<p><strong>追问/误答：<\/strong> 长度一致只证明数量一致，不证明位置语义一致。\n<strong>依据：<\/strong> <code>rag/nlp/model.py::rerank_similarity<\/code>、<code>Dealer.rerank_by_model<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--9-内容哈希去重有什么代价\">9. 内容哈希去重有什么代价？<\/h3>\n<p><strong>参考回答：<\/strong> 当前 hash(content+session) 合并相同段落，却把文件归属一起覆盖；P05 证明两个文档的 chunk ID 相同而 doc_id 不同。若业务要保留每个来源，应把文档/版本纳入身份；若追求存储去重，则单独维护内容实体的多来源关系。选型取决于引用和删除语义，不只看空间节省。<\/p>\n<p><strong>追问/误答：<\/strong> 这里不是“xxhash 随机碰撞”，而是确定相同输入产生相同 ID。\n<strong>依据：<\/strong> F08、<code>process_item<\/code>、ES bulk index 操作。<\/p>\n<h3 id=\"rag-interview-questions--10-sse-的错误为什么不会自动弹出\">10. SSE 的错误为什么不会自动弹出？<\/h3>\n<p><strong>参考回答：<\/strong> 流开始后 HTTP 可以一直是 200，后续 error 是数据事件。当前前端只解析 data.content，忽略 event 与 role，P09 看到错误文本进入答案。应设计独立错误和终态状态，保留部分答案，并处理取消/EOF。推荐问题是答案结束后的第二个调用，应能单独失败。<\/p>\n<p><strong>追问/误答：<\/strong> 只在 Axios catch 中处理非 2xx，覆盖不了流内业务错误。\n<strong>依据：<\/strong> F10、<code>chat.get_chat_completion<\/code>、<code>sendChat::parseData<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--11-为什么-markdown-渲染需要安全边界\">11. 为什么 Markdown 渲染需要安全边界？<\/h3>\n<p><strong>参考回答：<\/strong> 文档和模型输出都不是可信 HTML。当前 Marked 输出直接送 dangerouslySetInnerHTML；P10 验证合成事件属性仍存在，但没有执行浏览器攻击。我建议按产品需求禁用原始 HTML或做白名单清洗，并回归表格、代码和引用渲染。<\/p>\n<p><strong>追问/误答：<\/strong> Markdown 解析器不是 sanitizer；不能用前端已登录作为内容可信的证明。\n<strong>依据：<\/strong> F09、<code>components/markdown/index.tsx<\/code>。<\/p>\n<h3 id=\"rag-interview-questions--12-如何证明这次审查可靠\">12. 如何证明这次审查可靠？<\/h3>\n<p><strong>参考回答：<\/strong> 我记录总仓库与两个子模块 SHA，区分深入阅读与结构浏览；对接口缺失、索引不一致、临时路径越界、bulk 错误传播、chunk 身份和解析输入使用真实函数配合 fake 外部边界。60 个 Python 文件语法通过，前端默认安装失败，legacy peer 模式构建成功，lint 为 26 errors/10 warnings。我没有把这些结果包装成完整应用或生产验证。<\/p>\n<p><strong>追问/误答：<\/strong> 为什么不直接启动后端跑全套？导入会触及配置、资源和外部 SDK；未隔离的启动可能读取秘密或调用服务。AST 探针牺牲初始化覆盖，换取明确的离线验证边界。\n<strong>依据：<\/strong> 01 覆盖矩阵、03 探针摘要、本地 evidence 脚本。<\/p>\n<h3 id=\"rag-interview-questions--13-有限时间内优先修什么怎样回滚\">13. 有限时间内优先修什么，怎样回滚？<\/h3>\n<p><strong>参考回答：<\/strong> 先处理凭据、路径/授权与 HTML 边界，再打通登录/上传/问答契约，然后使写入和流状态可信。修复知识库 ID 与文档版本时用新命名空间或发布指针，验证后切读；旧索引保留可回退，不先删数据。完成正确性后再评估队列、分片与模型质量。<\/p>\n<p><strong>追问/误答：<\/strong> 没有负载基线不能给出“扩容后快十倍”；轮换秘密不能通过恢复旧秘密回滚。\n<strong>依据：<\/strong> 04 分阶段路线图及迁移章节。<\/p>\n<h3 id=\"rag-interview-questions--表达边界与模拟练习\">表达边界与模拟练习<\/h3>\n<p>可以说“审查并离线复现了某路径”“提出了状态/接口方案”；不能说“已修复生产事故”“做过百万并发”“RAG 精度提升多少”。建议用 10 分钟依次介绍系统、一个 F 项的失败机制、最小修复、失败注入验收和未覆盖范围；这是未执行的学习练习，不是新增实施任务。<\/p>","outline":[{"lvl":1,"text":"rag · 面试问答手册","id":"rag-interview-questions--rag--面试问答手册"},{"lvl":2,"text":"使用方式","id":"rag-interview-questions--使用方式"},{"lvl":2,"text":"1. 用两分钟介绍系统","id":"rag-interview-questions--1-用两分钟介绍系统"},{"lvl":2,"text":"2. 最值得保留的设计是什么？","id":"rag-interview-questions--2-最值得保留的设计是什么"},{"lvl":2,"text":"3. 为什么文件上传成功，聊天却查不到？","id":"rag-interview-questions--3-为什么文件上传成功聊天却查不到"},{"lvl":2,"text":"4. 会话 ID 能否充当访问控制？","id":"rag-interview-questions--4-会话-id-能否充当访问控制"},{"lvl":2,"text":"5. 什么是上传的“成功”？","id":"rag-interview-questions--5-什么是上传的成功"},{"lvl":2,"text":"6. 为何用了 async 仍可能阻塞？","id":"rag-interview-questions--6-为何用了-async-仍可能阻塞"},{"lvl":2,"text":"7. 混合检索默认链是什么？","id":"rag-interview-questions--7-混合检索默认链是什么"},{"lvl":2,"text":"8. 重排包装为什么可能出错？","id":"rag-interview-questions--8-重排包装为什么可能出错"},{"lvl":2,"text":"9. 内容哈希去重有什么代价？","id":"rag-interview-questions--9-内容哈希去重有什么代价"},{"lvl":2,"text":"10. SSE 的错误为什么不会自动弹出？","id":"rag-interview-questions--10-sse-的错误为什么不会自动弹出"},{"lvl":2,"text":"11. 为什么 Markdown 渲染需要安全边界？","id":"rag-interview-questions--11-为什么-markdown-渲染需要安全边界"},{"lvl":2,"text":"12. 如何证明这次审查可靠？","id":"rag-interview-questions--12-如何证明这次审查可靠"},{"lvl":2,"text":"13. 有限时间内优先修什么，怎样回滚？","id":"rag-interview-questions--13-有限时间内优先修什么怎样回滚"},{"lvl":2,"text":"表达边界与模拟练习","id":"rag-interview-questions--表达边界与模拟练习"}],"words":2454,"read":6}]}</script>

'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'})}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hl(text,q){
  if(!q) return esc(text);
  var parts=q.trim().split(/\s+/).filter(function(x){return x.length>0}).map(reEsc);
  if(!parts.length) return esc(text);
  var re=new RegExp('('+parts.join('|')+')','gi');
  return esc(text).replace(re,function(m){return '<mark>'+m+'</mark>'});
}

var panel=$('#panel'), qEl=$('#q'), curIdx=-1, curList=[];
function search(q){
  q=q.trim(); if(!q) return [];
  var parts=q.toLowerCase().split(/\s+/).filter(Boolean), out=[];
  INDEX.forEach(function(it){
    var score=0, hit=true;
    parts.forEach(function(p){
      var inT=it.t.indexOf(p)>=0, inG=it.g.indexOf(p)>=0, inX=it.x.indexOf(p)>=0;
      if(!inT&&!inG&&!inX){hit=false;return}
      if(inT) score+=inG?14:12; else if(inG) score+=8; else score+=3;
    });
    if(!hit) return;
    var snippet='';
    var pos=it.x.indexOf(parts[0]);
    if(pos<0) pos=0;
    var s=Math.max(0,pos-46), e=Math.min(it.x.length,pos+parts[0].length+92);
    snippet=(s>0?'…':'')+it.x.slice(s,e)+(e<it.x.length?'…':'');
    out.push({a:it.a,score:score,snippet:snippet});
  });
  out.sort(function(x,y){return y.score-x.score||x.a.title.length-y.a.title.length});
  return out.slice(0,24);
}
function renderPanel(q,res){
  if(!q){panel.classList.remove('open');return}
  var h='<div class="sresults"><div class="sh">';
  h+= res.length?('找到 <b>'+res.length+'</b> 个条目 · <b>↑↓</b> 选择 · <b>Enter</b> 打开'):'没有匹配「'+esc(q)+'」的条目';
  h+='</div>';
  h+=res.map(function(r,i){
    return '<a class="sitem'+(i===curIdx?' cur':'')+'" href="'+esc(linkOf(r.a))+'"'+tgtAttr(r.a)+' data-i="'+i+'">'
      +'<div class="st">'+hl(r.a.title,q)+'</div>'
      +'<div class="sp">'+hl(r.snippet,q)+'</div>'
      +'<div class="sn">'+esc(catName(r.a.cat))+(r.a.ext?' · 外部链接':'')+(r.a.tags.length?' · #'+esc(r.a.tags.join(' #')):'')+'</div></a>'}).join('');
  h+='</div>'; panel.innerHTML=h; panel.classList.add('open');
}

/* ---------------- 代码块装饰 + 滚动同步 ---------------- */
function decorate(){
  $$('#docbody pre').forEach(function(pre){
    if(pre.querySelector('.copy')) return;
    var b=document.createElement('button');
    b.className='copy'; b.type='button'; b.textContent='复制';
    b.addEventListener('click',function(){
      var code=pre.querySelector('code'); var txt=code?code.textContent:pre.textContent;
      var done=function(){b.textContent='已复制';b.classList.add('done');
        setTimeout(function(){b.textContent='复制';b.classList.remove('done')},1400)};
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done).catch(function(){fallback(txt,done)});
      }else{fallback(txt,done)}
    });
    pre.appendChild(b);
  });
}
function fallback(txt,cb){
  var ta=document.createElement('textarea'); ta.value=txt;
  ta.style.cssText='position:fixed;top:-1000px'; document.body.appendChild(ta);
  ta.select(); try{document.execCommand('copy');cb()}catch(e){}
  document.body.removeChild(ta);
}
var spyHandler=null, rafPending=false;
function buildSpy(){
  var main=$('#main');
  if(spyHandler){ main.removeEventListener('scroll',spyHandler); spyHandler=null }
  var links=$$('#dout a'); if(!links.length) return;
  var map={}; links.forEach(function(l){ if(l.dataset.anchor) map[l.dataset.anchor]=l });
  var hs=$$('#docbody h2,#docbody h3,#docbody h4,#docbody h5'); if(!hs.length) return;
  spyHandler=function(){
    if(rafPending) return;
    rafPending=true;
    (window.requestAnimationFrame||function(f){setTimeout(f,16)})(function(){
      rafPending=false;
      // 取「已经滚过顶栏、且最靠下」的那个标题 = 当前正在阅读的章节
      var line=main.getBoundingClientRect().top+86;
      var cur=hs[0];
      for(var i=0;i<hs.length;i++){
        if(hs[i].getBoundingClientRect().top<=line) cur=hs[i]; else break;
      }
      var l=map[cur.id];
      if(!l||l.classList.contains('on')) return;
      links.forEach(function(x){x.classList.remove('on')});
      l.classList.add('on');
      // 目录很长时把当前项带进视野（block:'nearest' 只做最小滚动）
      if(l.scrollIntoView) l.scrollIntoView({block:'nearest'});
    });
  };
  main.addEventListener('scroll',spyHandler,{passive:true});
  spyHandler();
}
function bindProgress(){
  $('#main').addEventListener('scroll',function(){
    var el=$('#main');
    var max=el.scrollHeight-el.clientHeight;
    $('#progress').style.width=(max>0?(el.scrollTop/max*100):0)+'%';
  },{passive:true});
}

function route(){
  var hash=location.hash||'#/';

  if(hash.charAt(1)!=='/') return;

  document.body.classList.remove('nav-open');
  if(hash.indexOf('#/a/')===0){ viewArticle(decodeURIComponent(hash.slice(4))) }
  else if(hash.indexOf('#/c/')===0){ viewCat(decodeURIComponent(hash.slice(4))) }
  else if(hash.indexOf('#/t/')===0){ viewTag(decodeURIComponent(hash.slice(4))) }
  else if(hash==='#/fav'){ viewFavs() }
  else if(hash==='#/hist'){ viewList('最近阅读','按打开时间倒序，最多保留 24 条。',
      S.hist.map(function(id){return byId[id]}).filter(Boolean),'还没有阅读记录。') }
  else if(hash==='#/tags'){ viewTags() }
  else { viewHome() }
  $('#main').scrollTop = (hash.indexOf('#/a/')===0)?0:$('#main').scrollTop;
}

/* Embedded in build.py's application closure. No network or external runtime. */
function cleanBody(html, id){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var allowed='p div section article span h2 h3 h4 h5 h6 br hr strong b em i u s del blockquote pre code ul ol li table thead tbody tfoot tr th td caption a dl dt dd details summary sup sub kbd samp mark'.split(' ');
  var drop='script style iframe object embed svg math form input button textarea select link meta base img audio video source'.split(' ');
  Array.from(doc.body.querySelectorAll('*')).forEach(function(el){
    var tag=el.tagName.toLowerCase();
    if(drop.indexOf(tag)>=0){el.remove();return}
    if(tag==='h1'){var h=doc.createElement('h2');while(el.firstChild)h.appendChild(el.firstChild);el.replaceWith(h);el=h;tag='h2'}
    if(allowed.indexOf(tag)<0){el.replaceWith.apply(el,Array.from(el.childNodes));return}
    Array.from(el.attributes).forEach(function(at){
      var n=at.name, v=at.value;
      var keep=(n==='id'&&v.indexOf(id+'--')===0&&/^[\w\u0080-\uffff-]+$/.test(v))
        ||(n==='class'&&/^[\w\s-]*$/.test(v))
        ||(tag==='a'&&n==='href'&&/^(https?:\/\/|mailto:|#|(?:\.\/)?index\.html#\/)/i.test(v)&&!/[\u0000-\u0020]/.test(v))
        ||((tag==='td'||tag==='th')&&(n==='colspan'||n==='rowspan')&&/^\d{1,3}$/.test(v));
      if(!keep) el.removeAttribute(n);
    });
    if(tag==='a') el.setAttribute('rel','noopener noreferrer');
  });
  var ids=new Set();
  Array.from(doc.body.querySelectorAll('[id]')).forEach(function(el){
    if(ids.has(el.id)) el.removeAttribute('id'); else ids.add(el.id);
  });
  var outline=[], n=0;
  Array.from(doc.body.querySelectorAll('h2,h3,h4,h5')).forEach(function(h){
    if(!h.id){do{h.id=id+'--edit-'+(++n)}while(ids.has(h.id));ids.add(h.id)}
    if(h.textContent.trim()) outline.push({id:h.id,lvl:Number(h.tagName.slice(1))-1,text:h.textContent.trim()});
  });
  Array.from(doc.body.querySelectorAll('table')).forEach(function(t){
    if(!t.parentElement.classList.contains('tw')){var w=doc.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)}
  });
  return {html:doc.body.innerHTML,outline:outline,text:doc.body.textContent||''};
}
function normalizeNote(a){
  if(!a||typeof a.id!=='string'||!(/^[a-zA-Z0-9_-]+$/).test(a.id)||typeof a.html!=='string'
    ||typeof a.title!=='string'||!a.title.trim()||!Array.isArray(a.tags)||!a.tags.every(function(t){return typeof t==='string'})) throw new Error('笔记字段不完整');
  if(a.ext) throw new Error('外链书签不支持正文编辑');
  var body=cleanBody(a.html,a.id);
  var summary=typeof a.summary==='string'?a.summary:'';
  var text=a.title+summary+a.tags.join(' ')+body.text;
  var words=(text.match(/[\u4e00-\u9fff]/g)||[]).length+(text.match(/[A-Za-z0-9_]+/g)||[]).length;
  return {id:a.id,cat:typeof a.cat==='string'&&/^[\w-]+$/.test(a.cat)?a.cat:'imported',
    title:a.title.trim(),kicker:typeof a.kicker==='string'?a.kicker:'',summary:summary,
    tags:a.tags,html:body.html,outline:body.outline,words:words,read:Math.max(1,Math.ceil(words/500)),
    updated:typeof a.updated==='string'?a.updated:''};
}
function readNotes(){
  var stored=LS.get('notes',null), result={version:2,extra:[],edits:Object.create(null)};
  var list=stored&&stored.version===2?stored.extra:LS.get('extra',[]);
  var seen=new Set(DATA.arts.map(function(a){return a.id}));
  if(Array.isArray(list)) list.forEach(function(a){
    try{a=normalizeNote(a);if(!seen.has(a.id)){result.extra.push(a);seen.add(a.id)}}catch(e){}
  });
  if(stored&&stored.edits&&typeof stored.edits==='object') Object.keys(stored.edits).forEach(function(id){
    try{var a=normalizeNote(stored.edits[id]);if(a.id===id&&seen.has(id)) result.edits[id]=a}catch(e){}
  });
  return result;
}
function refreshNotes(){
  extra=noteState.extra;edits=noteState.edits;
  ARTS=DATA.arts.concat(extra).map(function(a){return Object.assign({},a,edits[a.id]||{})});
  CATS=DATA.cats.slice();
  ARTS.forEach(function(a){if(!CATS.some(function(c){return c.id===a.cat})) CATS.push({id:a.cat,name:a.cat,icon:'·',desc:'来自导入的知识条目。'})});
  SHOWCATS=CATS.filter(function(c){return !c.nav});
  byId=Object.create(null);ARTS.forEach(function(a){byId[a.id]=a;a._plain=plain(a.html)+(a.ext?' '+a.summary+' '+a.tags.join(' '):'')});
  EXTS=ARTS.filter(function(a){return a.ext});
  INDEX=ARTS.map(function(a){return {a:a,t:(a.title+' '+(a.kicker||'')+' '+a.tags.join(' ')).toLowerCase(),g:a.tags.join(' ').toLowerCase(),x:a._plain.toLowerCase()}});
}
function noteStats(){
  return ARTS.reduce(function(s,a){s.words+=a.words;s.tables+=(a.html.match(/<table\b/g)||[]).length;
    s.code+=(a.html.match(/<pre\b/g)||[]).length;s.anchors+=(a.html.match(/\sid="/g)||[]).length;return s},
    {words:0,tables:0,code:0,anchors:0});
}
function persistNotes(next, expected){
  if(expected!==undefined&&localStorage.getItem('kb.notes')!==expected) throw new Error('其他页面已修改笔记，请关闭编辑器后重新打开再保存');
  try{localStorage.setItem('kb.notes',JSON.stringify(next))}
  catch(e){throw new Error('本机存储不可用或空间不足，修改尚未保存。请复制正文或腾出空间后重试')}
  noteState=next;refreshNotes();
}
function importNotes(o){
  if(!Array.isArray(o)&&(!o||!Array.isArray(o.arts))) throw new Error('备份格式不正确');
  if(o.version!==undefined&&o.version!==1&&o.version!==2) throw new Error('不支持这个备份版本');
  var expected=localStorage.getItem('kb.notes'), next=readNotes();
  var list=Array.isArray(o)?o:o.arts, updates=o.edits===undefined?[]:o.edits;
  if(!Array.isArray(updates)) throw new Error('修改记录格式不正确');
  var known=new Set(DATA.arts.concat(next.extra).map(function(a){return a.id}));
  var added=0, changed=0;
  list.forEach(function(a){
    a=normalizeNote(Object.assign({title:a&&a.id,tags:[]},a));
    if(!known.has(a.id)){known.add(a.id);next.extra.push(a);added++}
  });
  updates.forEach(function(a){
    a=normalizeNote(a);
    if(!known.has(a.id)||DATA.arts.some(function(b){return b.id===a.id&&b.ext})) throw new Error('修改记录找不到原笔记：'+a.id);
    next.edits[a.id]=a;changed++;
  });
  if(changed&&!window.confirm('将恢复 '+changed+' 条笔记修改，并覆盖本机同名笔记的当前内容，是否继续？')) return;
  persistNotes(next,expected);
  ['favs','hist'].forEach(function(key){
    if(Array.isArray(o[key])){S[key]=Array.from(new Set(o[key].filter(function(id){return typeof id==='string'&&known.has(id)}).concat(S[key])));
      if(key==='hist') S[key]=S[key].slice(0,24);LS.set(key,S[key])}
  });
  route();toast('已导入 '+added+' 条笔记，恢复 '+changed+' 条修改');
}

var editingId=null, editorOriginal='', editorVersion, returnFocus=null;
function editorValue(){return JSON.stringify([$('#edit-title').value,$('#edit-summary').value,$('#edit-tags').value,$('#edit-body').innerHTML])}
function editorDirty(){return editor.open&&editorValue()!==editorOriginal}
function openEditor(id){
  if(!byId[id]||byId[id].ext) return;
  // Refresh the snapshot even if a storage event was missed while this tab was inactive.
  noteState=readNotes();refreshNotes();
  var a=byId[id];if(!a) return;
  try{editorVersion=localStorage.getItem('kb.notes')}catch(e){editorVersion=undefined}
  editingId=id;returnFocus=document.activeElement;
  $('#edit-title').value=a.title;$('#edit-summary').value=a.summary;$('#edit-tags').value=a.tags.join(', ');
  $('#edit-body').innerHTML=a.html;$('#edit-error').textContent='';editorOriginal=editorValue();
  editor.showModal();$('#edit-title').focus();
}
function closeEditor(){editor.close();editingId=null;noteState=readNotes();refreshNotes();route();if(returnFocus&&returnFocus.isConnected) returnFocus.focus();else {var b=$('[data-act="edit-note"]');if(b)b.focus()}}
function cancelEditor(){if(!editorDirty()||window.confirm('尚有未保存的修改，确定放弃吗？')) closeEditor()}
$('#edit-cancel').addEventListener('click',cancelEditor);
editor.addEventListener('cancel',function(e){e.preventDefault();cancelEditor()});
$('#edit-form').addEventListener('submit',function(e){
  e.preventDefault();
  try{
    var a=normalizeNote(Object.assign({},byId[editingId],{title:$('#edit-title').value,summary:$('#edit-summary').value,
      tags:$('#edit-tags').value.split(/[,，]/).map(function(t){return t.trim()}).filter(Boolean),html:$('#edit-body').innerHTML,updated:new Date().toISOString()}));
    var next={version:2,extra:extra,edits:Object.assign(Object.create(null),edits)};next.edits[editingId]=a;
    persistNotes(next,editorVersion);closeEditor();toast('已保存到本机，可导出备份');
  }catch(err){$('#edit-error').textContent=err.message}
});
editor.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#edit-form').requestSubmit()}
});
$('.edit-toolbar').addEventListener('mousedown',function(e){if(e.target.closest('button')) e.preventDefault()});
$('.edit-toolbar').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var sel=window.getSelection();
  if(!sel.rangeCount||!$('#edit-body').contains(sel.anchorNode)) $('#edit-body').focus();
  document.execCommand(b.dataset.format||'formatBlock',false,b.dataset.block||null);
});
// Pasted and dropped content must not execute before the save-time sanitizer runs.
$('#edit-body').addEventListener('paste',function(e){
  e.preventDefault();var txt=e.clipboardData&&e.clipboardData.getData('text/plain');
  if(txt) document.execCommand('insertText',false,txt);
});
$('#edit-body').addEventListener('drop',function(e){e.preventDefault()});
function resetNote(id){
  if(!edits[id]||!window.confirm('恢复这篇笔记的原文？本机修改将移除，建议先导出备份。'))return;
  try{var expected=localStorage.getItem('kb.notes'),next=readNotes();delete next.edits[id];persistNotes(next,expected);route();toast('已恢复原文')}
  catch(e){toast(e.message)}
}
window.addEventListener('beforeunload',function(e){if(editorDirty()){e.preventDefault();e.returnValue=''}});
window.addEventListener('storage',function(e){if(e.key==='kb.notes'||e.key===null){
  if(editor.open){$('#edit-error').textContent='其他页面已修改笔记。请保留当前草稿，关闭编辑器后重新打开。';return}
  noteState=readNotes();refreshNotes();route();
}});


/* ---------------- 启动 ---------------- */
applyTheme(); applyFs(); renderSide(); bindProgress(); route();
})();
</script>
</body>
</html>
